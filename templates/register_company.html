{% extends "base.html" %}
{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg p-4">

<div class="text-center mb-4">
<h2><i class="fa-solid fa-building"></i> Company Registration</h2>
<p class="text-muted">Register your company to post placement drives</p>
</div>

<!-- TOGGLE -->

<div class="text-center mb-4">
<a href="{{ url_for('register_student') }}" class="btn btn-outline-secondary me-2">
Student
</a>

<a href="{{ url_for('register_company') }}" class="btn btn-success">
Company
</a>
</div>

<form method="POST">

<div class="row">

<div class="col-12 mb-3">
<label class="form-label">Company Name</label>
<input type="text" name="name" class="form-control" placeholder="TechCorp Solutions" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">HR Name</label>
<input type="text" name="hr_name" class="form-control" placeholder="Jane Smith" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">HR Contact</label>
<input type="text" name="hr_contact" class="form-control" placeholder="+91 9123456789" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Company Email</label>
<input type="email" name="email" class="form-control" placeholder="hr@company.com" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Website</label>
<input type="text" name="website" class="form-control" placeholder="https://company.com" required>
</div>

<div class="col-12 mb-3">
<label class="form-label">Company Description</label>
<textarea name="description" class="form-control" rows="3" placeholder="Brief description of your company..." required></textarea>
</div>

<div class="col-12 mb-4">
<label class="form-label">Password</label>
<input type="password" name="password" class="form-control" required>
</div>

</div>

<div class="alert alert-info">
Your company registration will be reviewed by the admin before you can access the dashboard.
</div>

<button type="submit" class="btn btn-success w-100">
<i class="fa-solid fa-building-circle-check"></i> Register Company
</button>

</form>

<div class="text-center mt-3">
<small>
Already have an account?
<a href="{{ url_for('login') }}">Login here</a>
</small>
</div>

</div>

</div>

</div>

</div>

{% endblock %}
