{% extends "company_layout.html" %}
{% block company_content %}

<h2 class="fw-bold">Edit Placement Drive</h2>
<p class="text-muted">Update the details of your placement drive</p>

<div class="card p-4 shadow-sm">

<form method="POST">

<div class="mb-3">
<label>Job Title</label>
<input type="text"
name="job_title"
class="form-control"
value="{{ drive.job_title }}"
required>
</div>

<div class="mb-3">
<label>Job Description</label>
<textarea
name="job_description"
class="form-control"
rows="3"
required>{{ drive.job_description }}</textarea>
</div>

<div class="mb-3">
<label>Eligibility</label>
<input type="text"
name="eligibility"
class="form-control"
value="{{ drive.eligibility }}">
</div>

<div class="mb-3">
<label>Minimum CGPA</label>
<input type="number"
step="0.01"
name="min_cgpa"
class="form-control"
value="{{ drive.min_cgpa }}">
</div>

<div class="mb-3">
<label>Salary</label>
<input type="text"
name="salary"
class="form-control"
value="{{ drive.salary }}">
</div>

<div class="mb-3">
<label>Location</label>
<input type="text"
name="location"
class="form-control"
value="{{ drive.location }}">
</div>

<div class="mb-3">
<label>Application Deadline</label>
<input type="date"
name="deadline"
class="form-control"
value="{{ drive.deadline.strftime('%Y-%m-%d') }}" 
required>
</div>

<button class="btn btn-dark">
Update Drive
</button>

<a href="/company/drives" class="btn btn-secondary">
Cancel
</a>

</form>

</div>

{% endblock %}
