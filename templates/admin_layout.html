{% extends "base.html" %}
{% block content %}

<!-- TOP NAVBAR -->

<nav class="navbar navbar-dark bg-danger px-4">
    <span class="navbar-brand">
        <i class="fa-solid fa-graduation-cap"></i>
        Campus Placement Portal
    </span>

    <a href="/logout" class="text-white">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
    </a>
</nav>

<div class="d-flex">

<!-- SIDEBAR -->

<div class="bg-white border p-3" style="width:260px; min-height:100vh">

<a href="{{ url_for('admin_dashboard') }}" class="btn btn-danger w-100 mb-3">
<i class="fa-solid fa-table"></i> Dashboard
</a>

<a href="{{ url_for('admin_companies') }}" class="btn btn-light w-100 mb-2 text-start">
<i class="fa-solid fa-building"></i> Manage Companies
</a>

<a href="{{ url_for('admin_students') }}" class="btn btn-light w-100 mb-2 text-start">
<i class="fa-solid fa-users"></i> Manage Students
</a>

<a href="{{ url_for('admin_drives') }}" class="btn btn-light w-100 mb-2 text-start">
<i class="fa-solid fa-briefcase"></i> Manage Drives
</a>

<a href="{{ url_for('admin_applications') }}" class="btn btn-light w-100 text-start">
<i class="fa-solid fa-file"></i> View Applications
</a>

</div>

<!-- MAIN CONTENT -->

<div class="flex-grow-1 p-4 bg-light">

{% block admin_content %}{% endblock %}

</div>

</div>

{% endblock %}
