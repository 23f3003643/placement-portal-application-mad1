{% extends "company_layout.html" %}

{% block company_content %}

<h2 class="fw-bold mb-3">Company Profile</h2>
<p class="text-muted">Manage your company information</p>

<div class="card p-4 shadow-sm">

<h5 class="mb-3">Company Information</h5>

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Company Name</label>
<input name="name" class="form-control" value="{{ current_user.name }}" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">HR Name</label>
<input name="hr_name" class="form-control" value="{{ current_user.hr_name }}">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">HR Contact</label>
<input name="hr_contact" class="form-control" value="{{ current_user.hr_contact }}">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Email</label>
<input class="form-control" value="{{ current_user.email }}" disabled>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Website</label>
<input name="website" class="form-control" value="{{ current_user.website }}">
</div>

<div class="col-md-12 mb-3">
<label class="form-label">Company Description</label>
<textarea name="description" rows="4" class="form-control">{{ current_user.description }}</textarea>
</div>

</div>

<button class="btn btn-dark">
<i class="fa fa-save"></i> Save Changes
</button>

</form>

</div>

{% endblock %}
