{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-center align-items-center"
     style="min-height: 90vh;">

    <div class="glass-card" style="width:750px;">

        <div class="text-center mb-4">
            <h2>Create Account</h2>
            <p class="text-light">Register as a student</p>
        </div>

        <!-- Toggle Switch -->
        <div class="d-flex justify-content-center mb-4">
            <a href="/register/student"
               class="btn btn-premium me-2">Student</a>
            <a href="/register/company"
               class="btn btn-outline-light">Company</a>
        </div>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Full Name</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="John Doe"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Student ID</label>
                    <input type="text"
                           name="student_id"
                           class="form-control"
                           placeholder="STU001"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="student@college.edu"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Phone</label>
                    <input type="text"
                           name="phone"
                           class="form-control"
                           placeholder="+91-9876543210"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Degree</label>
                    <select name="degree"
                            class="form-select">
                        <option>Select degree</option>
                        <option>B.Tech</option>
                        <option>M.Tech</option>
                        <option>MBA</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Branch</label>
                    <select name="branch"
                            class="form-select">
                        <option>Select branch</option>
                        <option>CSE</option>
                        <option>ECE</option>
                        <option>Mechanical</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>CGPA</label>
                    <input type="text"
                           name="cgpa"
                           class="form-control"
                           placeholder="8.5">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Year</label>
                    <select name="year"
                            class="form-select">
                        <option>Select year</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                    </select>
                </div>

                <div class="col-12 mb-4">
                    <label>Password</label>
                    <input type="password"
                           name="password"
                           class="form-control"
                           required>
                </div>

            </div>

            <button type="submit"
                    class="btn btn-premium w-100">
                Register as Student
            </button>

        </form>

        <div class="text-center mt-3">
            <small>
                Already have an account?
                <a href="/login" class="text-info">
                    Login here
                </a>
            </small>
        </div>

    </div>
</div>

{% endblock %}
