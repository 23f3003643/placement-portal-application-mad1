{% extends "base.html" %}
{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg p-4">

<div class="text-center mb-4">
<h2><i class="fa-solid fa-user-graduate"></i> Student Registration</h2>
<p class="text-muted">Create your student placement account</p>
</div>

<!-- TOGGLE -->

<div class="text-center mb-4">
<a href="{{ url_for('register_student') }}" class="btn btn-primary me-2">
Student
</a>

<a href="{{ url_for('register_company') }}" class="btn btn-outline-secondary">
Company
</a>
</div>


<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Full Name</label>
<input type="text" name="name" class="form-control" placeholder="John Doe" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Student ID</label>
<input type="text" name="student_id" class="form-control" placeholder="STU001" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Email</label>
<input type="email" name="email" class="form-control" placeholder="student@college.edu" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Phone</label>
<input type="text" name="phone" class="form-control" placeholder="+91 9876543210" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Degree</label>
<select name="degree" class="form-select" required >
<option>B.Tech</option>
<option>M.Tech</option>
<option>MBA</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Branch</label>
<select name="branch" class="form-select" required>
<option>CSE</option>
<option>ECE</option>
<option>Mechanical</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">CGPA</label>
<input type="text" name="cgpa" class="form-control" placeholder="8.5" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Year</label>
<select name="year" class="form-select" required>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
</select>
</div>

<div class="col-12 mb-4">
<label class="form-label">Password</label>
<input type="password" name="password" class="form-control" required>
</div>

</div>

<button type="submit" class="btn btn-primary w-100">
<i class="fa-solid fa-user-plus"></i> Register as Student
</button>

</form>

<div class="text-center mt-3">
<small>
Already have an account?
<a href="{{ url_for('login') }}">Login here</a>
</small>
</div>

</div>

</div>

</div>

</div>

{% endblock %}
